<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <section class="sidebar-section">
        <div class="left-side">
            <div class="black-bar">
                <img src="img/odin-logo.png" class="odin-logo">
                <p class="odin-text">ODIN</p>
            </div>
        </div>
    </section>
    <section class="main-section">
        <div class=" right-side">
            <p class="p1">This is not a real online service! You know you need something like in your life to help you
                realize your deepest dreams.</p>
            <p class="p2">Sign up <em>now</em> to get started.</p>
            <p class="p3">You <em>know</em> you want to.</p>
        </div>
        <div class="form-box">
            <fieldset>
                <legend>Let's do this!</legend>
                <div class="form-input">
                    <label>First name</label>
                    <input>
                </div>
                <div>
                    <label>Last name</label>
                    <input>
                </div>
                <div>
                    <label>Email</label>
                    <input>
                </div>
                <div>
                    <label>Phone number</label>
                    <input>
                </div>
                <div>
                    <label>Password</label>
                    <input>
                </div>
                <div>
                    <label>Confirm password</label>
                    <input>
                </div>
            </fieldset>
        </div>
        <button>Create Account</button>
        <p>Already have an account?</p>
        <a>Log in</a>
    </section>
</body>

</html>
