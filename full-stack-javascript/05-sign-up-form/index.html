<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <section class="sidebar-section">
        <div class="left-side">
            <div class="black-bar">
                <img src="img/odin-logo.png" class="odin-logo" alt="Odin logo">
                <p class="odin-text">ODIN</p>
            </div>
            <p class="photo-credit">Photo by <a href="https://unsplash.com/@haliewestphoto" target="_blank" rel="noopener">Halie West</a> on <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a></p>
        </div>
    </section>
    <section class="main-section">
        <div class="right-side">
            <p class="p1">This is not a real online service! You know you need something like this in your life to help you
                realize your deepest dreams.</p>
            <p class="p2">Sign up <em>now</em> to get started.</p>
            <p class="p3">You <em>know</em> you want to.</p>
        </div>
        <div class="form-box">
            <form action="#" method="post">
                <fieldset>
                    <legend>Let's do this!</legend>
                    <div class="form-group">
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    <div class="form-group">
                        <label for="last_name">LAST NAME</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </fieldset>
            </form>
        </div>
        <div class="bottom-action">
            <button type="submit" class="btn-create">Create Account</button>
            <p>Already have an account? <a href="#">Log in</a></p>
        </div>
    </section>
</body>

</html>
